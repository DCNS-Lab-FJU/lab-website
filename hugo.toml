baseURL = "https://dcns-lab-fju.github.io/lab-website/"
languageCode = "en-us"
title = "DCNS Lab"
theme = "PaperMod"
enableGitInfo = true
defaultContentLanguage = "en"

# 啟用 JSON 輸出（PaperMod 搜尋功能所需）
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 雙語化設定（中文內容就緒後再取消註解）
# [languages]
#   [languages.en]
#     languageName = "EN"
#     weight = 1
#   [languages.zh-tw]
#     languageName = "中文"
#     weight = 2
#     title = "DCNS 實驗室"

[frontmatter]
  lastmod = [":git", "lastmod", "date", "publishDate"]

[menu]
  [[menu.main]]
    name = "Members"
    url = "members/"
    weight = 10

  [[menu.main]]
    name = "Publications"
    url = "publications/"
    weight = 20

  [[menu.main]]
    name = "Search"
    url = "search/"
    weight = 30
  
[params]
  hideAuthor = true

  [params.profileMode]
    enabled = true
    title = "DCNS Lab"
    subtitle = "Welcome to DCNS Lab."
    
    imageUrl = "images/members/lu-shu-ping.jpg"
    imageTitle = "Lu Shu Ping"
    imageWidth = 220
    imageHeight = 220
    [[params.profileMode.buttons]]
      name = "Members"
      url = "members/"

    [[params.profileMode.buttons]]
      name = "Publications"
      url = "publications/"
    [params.footer]
      text = "Created by Ting-Yu Chien (2026) · Maintained by Ting-Yu Chien"

